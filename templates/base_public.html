<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}和康失物招领{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar public-nav">
        <button class="back-btn public-back" onclick="history.back()" title="返回上一页">←</button>
        <div class="brand">🏥 和康中医医院 · 失物招领</div>
        <div class="nav-links">
            <a href="{{ url_for('public_index') }}" class="{% if request.endpoint == 'public_index' %}active{% endif %}">失物招领</a>
            <a href="{{ url_for('public_report') }}" class="{% if request.endpoint == 'public_report' %}active{% endif %}">我要报失</a>
        </div>
        <div class="user-box">
            <a href="{{ url_for('login') }}" class="admin-entry">管理员入口 →</a>
        </div>
    </nav>

    <div class="container public-container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for cat, msg in messages %}
                <div class="flash {{ cat }}">{{ msg }}</div>
            {% endfor %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

    <footer class="public-footer">
        <div>门诊导医台 · 失物招领服务</div>
        <div style="margin-top:4px;font-size:12px;">捡到物品请交到导医台 · 认领请本人到场核对</div>
    </footer>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
    {% block script %}{% endblock %}
</body>
</html>
