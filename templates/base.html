<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}和康失物招领{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    {% block body %}
    <div class="admin-layout">
        <!-- 左侧侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-brand">🏥<br><span>失物招领</span></div>
            <nav class="sidebar-nav">
                <a href="{{ url_for('index') }}" class="{% if request.endpoint == 'index' %}active{% endif %}">
                    <span class="nav-icon">🏠</span><span>工作台</span>
                </a>
                <a href="{{ url_for('item_list') }}" class="{% if request.endpoint == 'item_list' %}active{% endif %}">
                    <span class="nav-icon">📋</span><span>失物总表</span>
                </a>
                <a href="{{ url_for('claims_manage') }}" class="{% if request.endpoint == 'claims_manage' %}active{% endif %}">
                    <span class="nav-icon">✅</span><span>认领管理</span>
                </a>
                <a href="{{ url_for('reports') }}" class="{% if request.endpoint == 'reports' %}active{% endif %}">
                    <span class="nav-icon">📬</span><span>报失处理</span>
                    <span class="nav-badge" id="reportsBadge" style="display:none;"></span>
                </a>
                <a href="{{ url_for('stats') }}" class="{% if request.endpoint == 'stats' %}active{% endif %}">
                    <span class="nav-icon">📊</span><span>统计导出</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <span class="user-label">当前</span>
                    <span class="user-name">{{ current_user }}</span>
                </div>
                <a href="{{ url_for('switch_user') }}" class="user-action">换人</a>
                <a href="{{ url_for('logout') }}" class="user-action">退出</a>
            </div>
        </aside>

        <!-- 右侧内容区 -->
        <main class="content-area">
            <div class="back-bar">
                <button class="back-btn" onclick="history.back()" title="返回上一页">← 返回</button>
            </div>
            <div class="container">
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% for cat, msg in messages %}
                        <div class="flash {{ cat }}">{{ msg }}</div>
                    {% endfor %}
                {% endwith %}

                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
    <script>
    /* 侧边栏报失角标：轮询待处理数 */
    function refreshReportsBadge(){
        fetch("{{ url_for('reports_pending_count') }}").then(function(r){return r.json();})
            .then(function(d){
                var b = document.getElementById('reportsBadge');
                if(!b) return;
                if(d.ok && d.count > 0){
                    b.textContent = d.count > 99 ? '99+' : d.count;
                    b.style.display = 'inline-block';
                }else{
                    b.style.display = 'none';
                }
            }).catch(function(){});
    }
    refreshReportsBadge();
    setInterval(refreshReportsBadge, 60000);  // 每分钟刷新
    </script>
    {% block script %}{% endblock %}
    {% endblock %}
</body>
</html>
